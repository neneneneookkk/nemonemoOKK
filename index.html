        button {

            text-align: left;

};

function renderNode(nodeId) {
    const content = document.getElementById('content');
    
    if (results[nodeId]) {
        const res = results[nodeId];
        let html = `
            <div class="result-section">
                <h2 class="result-title">${res.title}</h2>
                
                <div class="analysis-block">
                    <h3>① 現状どういう心かの分析結果</h3>
                    <div class="content-text">${res.analysis}</div>
                </div>

                <div class="analysis-block">
                    <h3>② それはどうしてそうなってるか</h3>
                    <div class="content-text">${res.why}</div>
                </div>

                <div class="analysis-block">
                    <h3>③ それをどう自分の中で処理するか</h3>
                    <div class="content-text">${res.process}</div>
                </div>

                <div class="analysis-block">
                    <h3>④ それをどう相手に伝えるか</h3>
                    <div class="content-text">${res.comm}</div>
                </div>

                <div class="analysis-block" style="text-align: center; border-top: 1px solid var(--border); padding-top: 2rem;">
                    <p><strong>りゅうとはずっと変わらずまさくんと一緒にいると決めてます。</strong></p>
                </div>

                <button class="restart-btn" onclick="renderNode('start')">診断をやり直す</button>

                <div class="glossary">
                    <h2>📚 心理学用語辞典</h2>`;
        
        res.glossary.forEach(term => {
            html += `
                <div class="glossary-item">
                    <span class="glossary-term">${term}</span>
                    ${glossaryTerms[term]}
                </div>`;
        });
        
        html += `</div></div>`;
        content.innerHTML = html;
        window.scrollTo(0, 0);
        return;
    }

    const node = data[nodeId];
    content.innerHTML = `
        <div class="question-box">
            <p class="question-text">${node.text}</p>
        </div>
        <div class="options">
            ${node.options.map(opt => `<button onclick="renderNode('${opt.next}')">${opt.text}</button>`).join('')}
        </div>
    `;
    window.scrollTo(0, 0);
}

renderNode('start');
</script>
