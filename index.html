<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI相性診断</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in {
            animation: fadeIn 0.6s ease-out;
        }
        .star-filled { color: #fbbf24; }
        .star-empty { color: #d1d5db; }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50 min-h-screen py-8 px-4">
    <div class="max-w-4xl mx-auto">
        <!-- ヘッダー -->
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-2">
                MBTI相性診断
            </h1>
            <p class="text-gray-600 text-sm md:text-base">あなたと相手の性格タイプから相性を分析します</p>
        </div>

        <!-- 選択エリア -->
        <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 mb-8">
            <div class="grid md:grid-cols-2 gap-6">
                <!-- あなたのMBTI -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        あなたのMBTI
                    </label>
                    <select id="userMbti" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:outline-none transition">
                        <option value="">選択してください</option>
                        <option value="INTJ">INTJ - 建築家</option>
                        <option value="INTP">INTP - 論理学者</option>
                        <option value="ENTJ">ENTJ - 指揮官</option>
                        <option value="ENTP">ENTP - 討論者</option>
                        <option value="INFJ">INFJ - 提唱者</option>
                        <option value="INFP">INFP - 仲介者</option>
                        <option value="ENFJ">ENFJ - 主人公</option>
                        <option value="ENFP">ENFP - 広報運動家</option>
                        <option value="ISTJ">ISTJ - 管理者</option>
                        <option value="ISFJ">ISFJ - 擁護者</option>
                        <option value="ESTJ">ESTJ - 幹部</option>
                        <option value="ESFJ">ESFJ - 領事官</option>
                        <option value="ISTP">ISTP - 巨匠</option>
                        <option value="ISFP">ISFP - 冒険家</option>
                        <option value="ESTP">ESTP - 起業家</option>
                        <option value="ESFP">ESFP - エンターテイナー</option>
                    </select>
                </div>

                <!-- 相手のMBTI -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        相手のMBTI
                    </label>
                    <select id="partnerMbti" class="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-pink-500 focus:outline-none transition">
                        <option value="">選択してください</option>
                        <option value="INTJ">INTJ - 建築家</option>
                        <option value="INTP">INTP - 論理学者</option>
                        <option value="ENTJ">ENTJ - 指揮官</option>
                        <option value="ENTP">ENTP - 討論者</option>
                        <option value="INFJ">INFJ - 提唱者</option>
                        <option value="INFP">INFP - 仲介者</option>
                        <option value="ENFJ">ENFJ - 主人公</option>
                        <option value="ENFP">ENFP - 広報運動家</option>
                        <option value="ISTJ">ISTJ - 管理者</option>
                        <option value="ISFJ">ISFJ - 擁護者</option>
                        <option value="ESTJ">ESTJ - 幹部</option>
                        <option value="ESFJ">ESFJ - 領事官</option>
                        <option value="ISTP">ISTP - 巨匠</option>
                        <option value="ISFP">ISFP - 冒険家</option>
                        <option value="ESTP">ESTP - 起業家</option>
                        <option value="ESFP">ESFP - エンターテイナー</option>
                    </select>
                </div>
            </div>

            <!-- 診断ボタン -->
            <button id="diagnoseBtn" class="w-full mt-6 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold py-4 px-6 rounded-lg hover:from-purple-700 hover:to-pink-700 transition transform hover:scale-[1.02] active:scale-[0.98] shadow-lg">
                相性を診断する
            </button>
        </div>

        <!-- 結果エリア -->
        <div id="results" class="hidden space-y-6">
            <!-- 総合相性 -->
            <div class="bg-white rounded-2xl shadow-xl p-6 md:p-8 fade-in">
                <h2 class="text-2xl font-bold text-gray-800 mb-4 text-center">総合相性スコア</h2>
                <div class="flex items-center justify-center">
                    <div class="text-6xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent" id="overallScore">
                        0%
                    </div>
                </div>
            </div>

            <!-- 恋愛相性 -->
            <div class="bg-gradient-to-br from-pink-50 to-rose-50 rounded-2xl shadow-xl p-6 md:p-8 border-2 border-pink-200 fade-in">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-2xl font-bold text-pink-700 flex items-center">
                        <span class="mr-2">💕</span> 恋愛相性
                    </h3>
                    <div class="text-3xl font-bold text-pink-600" id="loveScore">0%</div>
                </div>
                <div class="flex mb-4" id="loveStars"></div>
                <div class="space-y-4">
                    <div class="bg-white rounded-lg p-4">
                        <h4 class="font-semibold text-green-700 mb-2 flex items-center">
                            <span class="mr-2">✓</span> 合うところ
                        </h4>
                        <ul class="list-disc list-inside text-gray-700 space-y-1 text-sm" id="loveStrengths"></ul>
                    </div>
                    <div class="bg-white rounded-lg p-4">
                        <h4 class="font-semibold text-orange-700 mb-2 flex items-center">
                            <span class="mr-2">⚠</span> 注意点
                        </h4>
                        <ul class="list-disc list-inside text-gray-700 space-y-1 text-sm" id="loveWeaknesses"></ul>
                    </div>
                </div>
            </div>

            <!-- 友情相性 -->
            <div class="bg-gradient-to-br from-blue-50 to-cyan-50 rounded-2xl shadow-xl p-6 md:p-8 border-2 border-blue-200 fade-in">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-2xl font-bold text-blue-700 flex items-center">
                        <span class="mr-2">👥</span> 友情相性
                    </h3>
                    <div class="text-3xl font-bold text-blue-600" id="friendshipScore">0%</div>
                </div>
                <div class="flex mb-4" id="friendshipStars"></div>
                <div class="space-y-4">
                    <div class="bg-white rounded-lg p-4">
                        <h4 class="font-semibold text-green-700 mb-2 flex items-center">
                            <span class="mr-2">✓</span> 合うところ
                        </h4>
                        <ul class="list-disc list-inside text-gray-700 space-y-1 text-sm" id="friendshipStrengths"></ul>
                    </div>
                    <div class="bg-white rounded-lg p-4">
                        <h4 class="font-semibold text-orange-700 mb-2 flex items-center">
                            <span class="mr-2">⚠</span> 注意点
                        </h4>
                        <ul class="list-disc list-inside text-gray-700 space-y-1 text-sm" id="friendshipWeaknesses"></ul>
                    </div>
                </div>
            </div>

            <!-- 仕事相性 -->
            <div class="bg-gradient-to-br from-purple-50 to-indigo-50 rounded-2xl shadow-xl p-6 md:p-8 border-2 border-purple-200 fade-in">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-2xl font-bold text-purple-700 flex items-center">
                        <span class="mr-2">💼</span> 仕事相性
                    </h3>
                    <div class="text-3xl font-bold text-purple-600" id="workScore">0%</div>
                </div>
                <div class="flex mb-4" id="workStars"></div>
                <div class="space-y-4">
                    <div class="bg-white rounded-lg p-4">
                        <h4 class="font-semibold text-green-700 mb-2 flex items-center">
                            <span class="mr-2">✓</span> 合うところ
                        </h4>
                        <ul class="list-disc list-inside text-gray-700 space-y-1 text-sm" id="workStrengths"></ul>
                    </div>
                    <div class="bg-white rounded-lg p-4">
                        <h4 class="font-semibold text-orange-700 mb-2 flex items-center">
                            <span class="mr-2">⚠</span> 注意点
                        </h4>
                        <ul class="list-disc list-inside text-gray-700 space-y-1 text-sm" id="workWeaknesses"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // MBTIの特性を分析する関数
        function analyzeMBTI(type) {
            return {
                E_I: type[0], // Extrovert/Introvert
                S_N: type[1], // Sensing/Intuition
                T_F: type[2], // Thinking/Feeling
                J_P: type[3]  // Judging/Perceiving
            };
        }

        // 相性スコアを計算する関数
        function calculateCompatibility(user, partner) {
            const userTraits = analyzeMBTI(user);
            const partnerTraits = analyzeMBTI(partner);

            let love = 50;
            let friendship = 50;
            let work = 50;

            // E/I の相性
            if (userTraits.E_I === partnerTraits.E_I) {
                friendship += 15; // 同じエネルギー方向は友情に良い
                love += 10;
                work += 5;
            } else {
                love += 15; // 補完関係は恋愛に良い
                friendship += 5;
                work += 10; // 仕事でもバランスが取れる
            }

            // S/N の相性
            if (userTraits.S_N === partnerTraits.S_N) {
                friendship += 15; // 同じ認識方法は友情に最適
                love += 10;
                work += 10;
            } else {
                love += 5;
                friendship -= 5;
                work += 5; // 異なる視点は仕事に有益
            }

            // T/F の相性
            if (userTraits.T_F === partnerTraits.T_F) {
                work += 15; // 同じ意思決定方法は仕事に良い
                friendship += 10;
                love += 5;
            } else {
                love += 15; // 補完関係は恋愛に良い
                friendship += 5;
                work += 0;
            }

            // J/P の相性
            if (userTraits.J_P === partnerTraits.J_P) {
                friendship += 10;
                love += 5;
                work += 5;
            } else {
                love += 10; // 補完関係
                friendship += 5;
                work += 15; // 計画性と柔軟性のバランスは仕事に最適
            }

            // 特別な相性パターン
            // 理想的なペア（デュアル関係）
            const idealPairs = [
                ['INTJ', 'ENFP'], ['INTP', 'ENFJ'], ['ENTJ', 'INFP'], ['ENTP', 'INFJ'],
                ['ISTJ', 'ESFP'], ['ISFJ', 'ESTP'], ['ESTJ', 'ISFP'], ['ESFJ', 'ISTP']
            ];

            if (idealPairs.some(pair =>
                (pair[0] === user && pair[1] === partner) ||
                (pair[1] === user && pair[0] === partner)
            )) {
                love += 20;
                friendship += 10;
            }

            // 同じタイプ
            if (user === partner) {
                friendship += 10;
                love += 5; // 理解し合えるが刺激は少ない
                work += 10;
            }

            // NTとNFの組み合わせ（理想主義者同士）
            if (userTraits.S_N === 'N' && partnerTraits.S_N === 'N') {
                love += 10;
                friendship += 10;
            }

            // STとSJの組み合わせ（現実主義者同士）
            if (userTraits.S_N === 'S' && partnerTraits.S_N === 'S') {
                work += 10;
                friendship += 5;
            }

            // スコアを0-100に正規化
            love = Math.min(100, Math.max(0, love));
            friendship = Math.min(100, Math.max(0, friendship));
            work = Math.min(100, Math.max(0, work));

            return { love, friendship, work };
        }

        // 具体的なアドバイスを生成する関数
        function generateAdvice(user, partner, category, score) {
            const userTraits = analyzeMBTI(user);
            const partnerTraits = analyzeMBTI(partner);

            let strengths = [];
            let weaknesses = [];

            if (category === 'love') {
                // E/I
                if (userTraits.E_I === partnerTraits.E_I) {
                    if (userTraits.E_I === 'E') {
                        strengths.push('二人ともアクティブで、一緒に外出や社交を楽しめる');
                        weaknesses.push('お互いに話したがって、相手の話を聞くことを忘れがち');
                    } else {
                        strengths.push('静かな時間を一緒に過ごすことを大切にできる');
                        weaknesses.push('外の世界との接点が減り、関係が閉鎖的になる可能性');
                    }
                } else {
                    strengths.push('外向的な人が内向的な人を外の世界に連れ出し、バランスが取れる');
                    weaknesses.push('社交的な活動の頻度について意見が分かれやすい');
                }

                // S/N
                if (userTraits.S_N === partnerTraits.S_N) {
                    if (userTraits.S_N === 'S') {
                        strengths.push('現実的で実用的なアプローチで問題を解決できる');
                        weaknesses.push('ロマンチックさや理想を語ることが少なくなりがち');
                    } else {
                        strengths.push('深い対話や哲学的な会話を楽しめる');
                        weaknesses.push('現実的な問題への対処が後回しになりやすい');
                    }
                } else {
                    strengths.push('直観的な人がビジョンを示し、現実的な人が実現する');
                    weaknesses.push('日常的な計画や将来の夢について話が噛み合わないことがある');
                }

                // T/F
                if (userTraits.T_F === partnerTraits.T_F) {
                    if (userTraits.T_F === 'T') {
                        strengths.push('論理的に問題を解決し、感情的にならずに議論できる');
                        weaknesses.push('感情表現が少なく、愛情を伝えることが苦手');
                    } else {
                        strengths.push('お互いの感情を大切にし、共感し合える');
                        weaknesses.push('感情的になりすぎて、冷静な判断ができなくなることがある');
                    }
                } else {
                    strengths.push('感情的な人が温かさを与え、論理的な人が冷静さを提供する');
                    weaknesses.push('論理 vs 感情で衝突することがあり、理解に時間がかかる');
                }

                // J/P
                if (userTraits.J_P === partnerTraits.J_P) {
                    if (userTraits.J_P === 'J') {
                        strengths.push('計画的にデートや将来設計を進められる');
                        weaknesses.push('柔軟性に欠け、予定外のことに対応しづらい');
                    } else {
                        strengths.push('自由で柔軟な関係を築ける');
                        weaknesses.push('計画性がなく、重要な決定を先延ばしにしがち');
                    }
                } else {
                    strengths.push('計画的な人が安定を、柔軟な人が変化を提供する');
                    weaknesses.push('整理整頓や時間管理について意見が対立しやすい');
                }

            } else if (category === 'friendship') {
                // E/I
                if (userTraits.E_I === partnerTraits.E_I) {
                    if (userTraits.E_I === 'E') {
                        strengths.push('一緒にイベントや集まりを楽しめる');
                        weaknesses.push('一人で静かに過ごす時間を作りづらい');
                    } else {
                        strengths.push('深い一対一の対話を重視する関係を築ける');
                        weaknesses.push('新しい友人グループに入りづらく、視野が狭くなりがち');
                    }
                } else {
                    strengths.push('お互いの社交スタイルを尊重し、バランスを取れる');
                    weaknesses.push('活動の好みが異なり、一緒に過ごす時間が減ることがある');
                }

                // S/N
                if (userTraits.S_N === partnerTraits.S_N) {
                    if (userTraits.S_N === 'S') {
                        strengths.push('現実的な話題や実際の経験を共有しやすい');
                        weaknesses.push('抽象的な議論や新しいアイデアに興味が向きにくい');
                    } else {
                        strengths.push('創造的なアイデアや深い話題で盛り上がれる');
                        weaknesses.push('現実離れした話ばかりで、実行に移せないことがある');
                    }
                } else {
                    strengths.push('異なる視点を持ち、お互いに学び合える');
                    weaknesses.push('興味や関心が異なり、共通の話題を見つけにくい');
                }

                // T/F
                if (userTraits.T_F === partnerTraits.T_F) {
                    if (userTraits.T_F === 'T') {
                        strengths.push('客観的な議論やディベートを楽しめる');
                        weaknesses.push('感情的なサポートが不足しがち');
                    } else {
                        strengths.push('感情を共有し、お互いを深く理解できる');
                        weaknesses.push('論理的な問題解決よりも感情に流されやすい');
                    }
                } else {
                    strengths.push('論理と感情のバランスが取れた関係');
                    weaknesses.push('意見の対立時に、アプローチの違いで誤解が生じやすい');
                }

                // J/P
                if (userTraits.J_P === partnerTraits.J_P) {
                    if (userTraits.J_P === 'J') {
                        strengths.push('計画的に会う約束ができ、予定を守れる');
                        weaknesses.push('突発的な誘いに対応しづらい');
                    } else {
                        strengths.push('気楽に会える柔軟な関係');
                        weaknesses.push('約束が曖昧になり、なかなか会えないことがある');
                    }
                } else {
                    strengths.push('計画性と柔軟性のバランスが取れる');
                    weaknesses.push('約束の仕方や時間の使い方について価値観が異なる');
                }

            } else if (category === 'work') {
                // E/I
                if (userTraits.E_I === partnerTraits.E_I) {
                    if (userTraits.E_I === 'E') {
                        strengths.push('活発にアイデアを出し合い、チームワークを発揮できる');
                        weaknesses.push('一人で集中する作業が苦手で、騒がしくなりがち');
                    } else {
                        strengths.push('集中して深く考える作業が得意');
                        weaknesses.push('コミュニケーション不足で、情報共有が遅れることがある');
                    }
                } else {
                    strengths.push('外交的な役割と内部作業を分担できる');
                    weaknesses.push('仕事のペースやスタイルが異なり、調整が必要');
                }

                // S/N
                if (userTraits.S_N === partnerTraits.S_N) {
                    if (userTraits.S_N === 'S') {
                        strengths.push('実務的で具体的なタスクを確実に遂行できる');
                        weaknesses.push('革新的なアイデアや長期ビジョンが不足しがち');
                    } else {
                        strengths.push('創造的なアイデアと長期戦略を立てられる');
                        weaknesses.push('細かい実務や現実的な制約を見落としやすい');
                    }
                } else {
                    strengths.push('ビジョンと実行の両方をカバーできる理想的な組み合わせ');
                    weaknesses.push('優先順位について意見が分かれやすい');
                }

                // T/F
                if (userTraits.T_F === partnerTraits.T_F) {
                    if (userTraits.T_F === 'T') {
                        strengths.push('客観的なデータに基づいて意思決定できる');
                        weaknesses.push('人間関係やチームの士気への配慮が不足しがち');
                    } else {
                        strengths.push('チームの調和を保ち、協力的な環境を作れる');
                        weaknesses.push('厳しい決断を避け、効率性が下がることがある');
                    }
                } else {
                    strengths.push('論理と人間性のバランスが取れた意思決定ができる');
                    weaknesses.push('意思決定の基準が異なり、対立することがある');
                }

                // J/P
                if (userTraits.J_P === partnerTraits.J_P) {
                    if (userTraits.J_P === 'J') {
                        strengths.push('計画的に期限を守り、組織的に仕事を進められる');
                        weaknesses.push('柔軟性に欠け、突発的な変化に対応しづらい');
                    } else {
                        strengths.push('柔軟に対応し、新しい機会を活かせる');
                        weaknesses.push('締め切りを守れず、計画性に欠ける');
                    }
                } else {
                    strengths.push('計画性と柔軟性を組み合わせた効果的な仕事ができる');
                    weaknesses.push('作業スタイルが異なり、ストレスを感じることがある');
                }
            }

            return { strengths, weaknesses };
        }

        // 星を表示する関数
        function displayStars(elementId, score) {
            const stars = Math.round(score / 20); // 0-100を0-5に変換
            const element = document.getElementById(elementId);
            element.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('span');
                star.className = i <= stars ? 'star-filled' : 'star-empty';
                star.textContent = '★';
                star.style.fontSize = '24px';
                star.style.marginRight = '4px';
                element.appendChild(star);
            }
        }

        // 診断を実行する関数
        function diagnose() {
            const userMbti = document.getElementById('userMbti').value;
            const partnerMbti = document.getElementById('partnerMbti').value;

            if (!userMbti || !partnerMbti) {
                alert('両方のMBTIを選択してください');
                return;
            }

            // 相性スコアを計算
            const scores = calculateCompatibility(userMbti, partnerMbti);
            const overall = Math.round((scores.love + scores.friendship + scores.work) / 3);

            // 総合スコアを表示
            document.getElementById('overallScore').textContent = overall + '%';

            // 各カテゴリのスコアと星を表示
            document.getElementById('loveScore').textContent = scores.love + '%';
            document.getElementById('friendshipScore').textContent = scores.friendship + '%';
            document.getElementById('workScore').textContent = scores.work + '%';

            displayStars('loveStars', scores.love);
            displayStars('friendshipStars', scores.friendship);
            displayStars('workStars', scores.work);

            // アドバイスを生成して表示
            const loveAdvice = generateAdvice(userMbti, partnerMbti, 'love', scores.love);
            const friendshipAdvice = generateAdvice(userMbti, partnerMbti, 'friendship', scores.friendship);
            const workAdvice = generateAdvice(userMbti, partnerMbti, 'work', scores.work);

            // 恋愛
            document.getElementById('loveStrengths').innerHTML =
                loveAdvice.strengths.map(s => `<li>${s}</li>`).join('');
            document.getElementById('loveWeaknesses').innerHTML =
                loveAdvice.weaknesses.map(w => `<li>${w}</li>`).join('');

            // 友情
            document.getElementById('friendshipStrengths').innerHTML =
                friendshipAdvice.strengths.map(s => `<li>${s}</li>`).join('');
            document.getElementById('friendshipWeaknesses').innerHTML =
                friendshipAdvice.weaknesses.map(w => `<li>${w}</li>`).join('');

            // 仕事
            document.getElementById('workStrengths').innerHTML =
                workAdvice.strengths.map(s => `<li>${s}</li>`).join('');
            document.getElementById('workWeaknesses').innerHTML =
                workAdvice.weaknesses.map(w => `<li>${w}</li>`).join('');

            // 結果を表示
            document.getElementById('results').classList.remove('hidden');

            // 結果までスクロール
            setTimeout(() => {
                document.getElementById('results').scrollIntoView({
                    behavior: 'smooth',
                    block: 'start'
                });
            }, 100);
        }

        // ボタンのイベントリスナー
        document.getElementById('diagnoseBtn').addEventListener('click', diagnose);

        // Enterキーでも診断できるように
        document.getElementById('userMbti').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') diagnose();
        });
        document.getElementById('partnerMbti').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') diagnose();
        });
    </script>
</body>
</html>
