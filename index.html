<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>恋愛愛着スタイル診断 - 遠距離恋愛編</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary: #6366f1;
            --secondary: #ec4899;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        #app {
            max-width: 600px;
            width: 100%;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin: 0;
        }
        .header p {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: 0.5rem;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: white;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 1rem;
        }
        button:hover {
            border-color: var(--primary);
            background: #f5f7ff;
        }
        .result-title {
            color: var(--secondary);
            font-size: 1.3rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #fce7f3;
            padding-bottom: 8px;
        }
        .result-desc {
            line-height: 1.8;
            margin-bottom: 2rem;
        }
        .term-ref {
            font-weight: bold;
            color: var(--primary);
            text-decoration: underline;
        }
        .glossary {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px dashed var(--border);
            text-align: left;
        }
        .glossary h3 {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 1rem;
        }
        .glossary-item {
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }
        .glossary-term {
            font-weight: bold;
            display: block;
            color: var(--primary);
        }
        .restart-btn {
            background: var(--text-sub);
            color: white;
            text-align: center;
            width: 100%;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <h1>恋愛愛着スタイル診断</h1>
        <p>〜過去の恋愛経験から形作られた現在の心理〜</p>
    </div>
    <div id="content"></div>
</div>

<script>
const data = {
    start: {
        text: "今のパートナー、あるいは直近の恋愛において、あなたが最も「苦しい」と感じる衝動はどちらに近いですか？",
        options: [
            { text: "嫌われたくない、繋がっていないと不安で仕方ない", next: "anxious_step2" },
            { text: "踏み込まれると逃げたくなる、一人の自由を奪われたくない", next: "avoidant_step2" }
        ]
    },
    // 不安ルート
    anxious_step2: {
        text: "遠距離恋愛特有の状況で、特にあなたの心を乱すものはどれですか？",
        options: [
            { text: "会えない時間に相手が何をしているか、誰といるか想像してしまう", next: "anxious_result_1" },
            { text: "連絡の頻度や熱量が少しでも減ると、愛情が冷めたのではないかと疑う", next: "anxious_result_2" }
        ]
    },
    // 回避ルート
    avoidant_step2: {
        text: "遠距離という距離感において、あなたの本音に近いものはどちらですか？",
        options: [
            { text: "会う約束やビデオ通話が「義務」のように感じて重荷になる", next: "avoidant_result_1" },
            { text: "相手が情緒的に頼ってくると、冷めてしまったり面倒だと感じる", next: "avoidant_result_2" }
        ]
    },
    // 結果データ
    results: {
        anxious_result_1: {
            title: "不安型：過覚醒アラート状態",
            desc: "あなたは過去の恋愛で「突然の拒絶」などを経験し、相手の動向に対して常にアンテナを張る（<span class='term-ref'>過覚醒</span>）状態にあります。遠距離では視覚的な確認ができないため、脳が「危険」を察知しやすく、結果として相手を縛るような（<span class='term-ref'>近接模索行動</span>）が強まっています。これはあなたの性格ではなく、心が身につけた防衛戦略です。",
            glossary: ["過覚醒", "近接模索行動"]
        },
        anxious_result_2: {
            title: "不安型：愛着システム過剰活性化",
            desc: "連絡の遅れを「愛の喪失」と直結させてしまうのは、あなたの（<span class='term-ref'>内的作業モデル</span>）が「自分は見捨てられる存在だ」という強い不安を学習してしまったからです。遠距離特有の「情報の少なさ」が、この（<span class='term-ref'>過剰活性化戦略</span>）を刺激し、返信を待つ時間を苦痛に変えています。",
            glossary: ["内的作業モデル", "過剰活性化戦略"]
        },
        avoidant_result_1: {
            title: "回避型：脱活性化による自己防衛",
            desc: "親密さを「自由の剥奪」と捉えてしまう状態です。遠距離でありながら圧迫感を感じるのは、あなたが（<span class='term-ref'>脱活性化戦略</span>）を用いて自分の感情をシャットダウンすることで、心の平穏を保とうとしているからです。過去の恋愛で、誰かに深く入り込まれて傷ついた経験が（<span class='term-ref'>親密さの回避</span>）を強化している可能性があります。",
            glossary: ["脱活性化戦略", "親密さの回避"]
        },
        avoidant_result_2: {
            title: "回避型：防衛的軽蔑パターン",
            desc: "相手の情緒的な依存に対して冷酷になってしまうのは、あなたが自分自身の「弱さ」を（<span class='term-ref'>抑圧</span>）しているためです。相手を「重い」「面倒だ」と低く見積もる（<span class='term-ref'>脱価値化</span>）を行うことで、自分が傷つく可能性のある「深い繋がり」から距離を置いています。これは、かつて自分を守るために必要だった鎧です。",
            glossary: ["抑圧", "脱価値化"]
        }
    },
    glossaryData: {
        "過覚醒": "周囲の些細な変化や刺激に対して、神経が過剰に過敏になっている状態。愛着の不安が強い時に起こりやすい。",
        "近接模索行動": "愛着対象（パートナー）との物理的・心理的距離を縮めようとする行動。過剰になると束縛や頻繁な連絡確認となる。",
        "内的作業モデル": "自分自身や他者、人間関係に対して持っている無意識の「思い込み」のテンプレート。",
        "過剰活性化戦略": "不安を解消するために、怒りや泣きつき、執着などを通じて相手の注意を引こうとする心の動き。",
        "脱活性化戦略": "親密さによる苦痛を避けるために、あえて感情を鈍麻させたり、相手への関心を意図的に逸らしたりすること。",
        "親密さの回避": "他者と深く関わること、弱みを見せることに対して、無意識に恐怖や嫌悪感を感じて遠ざけること。",
        "抑圧": "自分にとって受け入れがたい感情や記憶を、無意識の中に押し込めて意識しないようにすること。",
        "脱価値化": "相手の価値を不当に低く評価することで、その相手との関係が自分に与える影響力を弱め、自分を守ろうとする心理。"
    }
};

function render(nodeId) {
    const content = document.getElementById('content');
    
    // 結果の判定
    if (data.results[nodeId]) {
        const res = data.results[nodeId];
        let html = `<div class="result-card">
            <h2 class="result-title">${res.title}</h2>
            <div class="result-desc">${res.desc}</div>
            <button class="restart-btn" onclick="render('start')">診断をやり直す</button>
            <div class="glossary">
                <h3>解説：心理学用語集</h3>`;
        
        res.glossary.forEach(term => {
            html += `<div class="glossary-item">
                <span class="glossary-term">${term}</span>
                ${data.glossaryData[term]}
            </div>`;
        });
        
        html += `</div></div>`;
        content.innerHTML = html;
        return;
    }

    // 質問の表示
    const node = data[nodeId];
    let html = `<div class="question-text">${node.text}</div><div class="options">`;
    node.options.forEach(opt => {
        html += `<button onclick="render('${opt.next}')">${opt.text}</button>`;
    });
    html += `</div>`;
    content.innerHTML = html;
}

// 初期実行
render('start');
</script>

</body>
</html>
