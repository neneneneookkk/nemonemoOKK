<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愛着スタイル診断</title>
<style>
body{font-family:sans-serif;background:#f8fafc;margin:0;padding:20px}
#app{max-width:700px;margin:auto;background:#fff;padding:24px;border-radius:16px}
button{display:block;width:100%;margin:10px 0;padding:14px;border-radius:10px;border:1px solid #ddd;background:#fff;cursor:pointer}
button:hover{background:#eef2ff}
.term{color:#4f46e5;font-weight:bold}
.cta{background:#4f46e5;color:#fff;border:none}
</style>
</head>
<body>
<div id="app">
<div id="content">
<h2>愛着スタイル診断（恋愛経験ベース）</h2>
<p>これまでの恋愛で形成された「現在の状態」を診断します</p>
<button onclick="next('q1')">診断開始</button>
</div>
</div>

<script>
const flow={
q1:{text:"不安を感じるときの反応は？",
options:[
{text:"相手を失うのが怖い",next:"q2_anx"},
{text:"距離を取りたくなる",next:"q2_avd"}]},
q2_anx:{text:"遠距離で連絡が減ると？",
options:[
{text:"追いかける",next:"q3_anx1"},
{text:"自分を責める",next:"q3_anx2"}]},
q3_anx1:{text:"返信が遅い時は？",
options:[
{text:"何度も送る",next:"r1"},
{text:"試す行動をする",next:"r2"}]},
q3_anx2:{text:"相手が楽しそうだと？",
options:[
{text:"自分は不要と感じる",next:"r3"},
{text:"無理に明るくする",next:"r4"}]},
q2_avd:{text:"関係が深まると？",
options:[
{text:"逃げたくなる",next:"q3_avd1"},
{text:"相手を批判する",next:"q3_avd2"}]},
q3_avd1:{text:"一緒にいると？",
options:[
{text:"自由が奪われる",next:"r5"},
{text:"感情が消える",next:"r6"}]},
q3_avd2:{text:"相手が感情的だと？",
options:[
{text:"論理で押す",next:"r7"},
{text:"見下す",next:"r8"}]}
};

const results={
r1:{title:"不安型：追跡過多",text:"不安で<span class='term'>過覚醒</span>状態になり、<span class='term'>近接行動</span>が強まっています。"},
r2:{title:"不安型：試し行動",text:"本音を言えず<span class='term'>抗議行動</span>が出ています。"},
r3:{title:"不安型：自己否定",text:"<span class='term'>自己関連付け</span>により自分を責めています。"},
r4:{title:"不安型：偽り適応",text:"<span class='term'>偽りの自己</span>で本音を抑えています。"},
r5:{title:"回避型：自律防衛",text:"<span class='term'>脱活性化戦略</span>で距離を取っています。"},
r6:{title:"回避型：感情遮断",text:"<span class='term'>情動的遮断</span>が起きています。"},
r7:{title:"回避型：知的化",text:"<span class='term'>知的化</span>で感情を避けています。"},
r8:{title:"回避型：脱価値化",text:"<span class='term'>脱価値化</span>で自分を守っています。"}
};

function next(id){
const c=document.getElementById("content");

if(results[id]){
let r=results[id];
c.innerHTML=`
<h2>${r.title}</h2>
<p>${r.text}</p>

<h3>解決アクション</h3>
<ul>
<li>感情をそのまま認識する</li>
<li>相手に伝える準備をする</li>
<li>事実と解釈を分ける</li>
</ul>

<button class="cta" onclick="showAssertive()">アサーティブコミュニケーションを見る</button>
<button onclick="location.reload()">やり直す</button>
`;
return;
}

let q=flow[id];
c.innerHTML=`
<p>${q.text}</p>
${q.options.map(o=>`<button onclick="next('${o.next}')">${o.text}</button>`).join("")}
`;
}

function showAssertive(){
const c=document.getElementById("content");
c.innerHTML=`
<h2>アサーティブコミュニケーションとは</h2>
<p>自分も相手も尊重しながら正直に伝えるコミュニケーション（アサーション）です。</p>

<h3>やり方 5STEP</h3>
<ol>
<li>事実を整理する</li>
<li>自分の感情を言語化する</li>
<li>相手を責めずに伝える</li>
<li>具体的な要望を伝える</li>
<li>相手の反応を受け止める</li>
</ol>

<p style="margin-top:30px;font-weight:bold;">
りゅうとはずっと変わらずまさくんと一緒にいると決めてます。
</p>

<button onclick="location.reload()">診断に戻る</button>
`;
}
</script>
</body>
</html>
