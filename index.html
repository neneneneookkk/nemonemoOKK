<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>愛着スタイル深層診断</title>

<style>
body {
    font-family: sans-serif;
    background:#f8fafc;
    padding:20px;
}
#app {
    max-width:800px;
    margin:auto;
    background:#fff;
    padding:20px;
    border-radius:16px;
}
button {
    width:100%;
    padding:14px;
    margin-top:10px;
    cursor:pointer;
}
.block {
    margin-top:20px;
    padding:15px;
    background:#f1f5f9;
    border-radius:10px;
}
.cta-btn {
    background:#4f46e5;
    color:#fff;
}
</style>
</head>

<body>
<div id="app">

<div id="quiz-view">
<h2>診断スタート</h2>
<div id="question-container"></div>
</div>

<div id="result-view" style="display:none;"></div>

<div id="assertive-view" style="display:none;">
<h2>アサーティブコミュニケーションとは</h2>

<div class="block">
相手を尊重しながら自分の気持ちを正直に伝える方法です。攻撃でも我慢でもない「対等な伝え方」です。
</div>

<div class="block">
<h3>5STEP</h3>
<ol>
<li>事実をそのまま伝える</li>
<li>自分の感情を伝える</li>
<li>どうしてほしいか言う</li>
<li>そうなるメリットを伝える</li>
<li>相手の意見を聞く</li>
</ol>
</div>

<div class="block">
例：<br>
「返信がなくて寂しかった。忙しい時は一言ほしい。そうしてくれると安心できる」
</div>

<div style="margin-top:40px;text-align:center;font-weight:bold;">
りゅうとはずっと変わらずまさくんと一緒にいると決めてます。
</div>

<button class="cta-btn" onclick="showView('result-view')">戻る</button>
</div>

</div>

<script>
const flow = {
start: {
text: "どんな時に不安になる？",
options: [
{ text:"返信が遅い", next:"anx" },
{ text:"距離を取りたくなる", next:"avd" },
{ text:"嫌われた気がする", next:"fear" }
]
},

anx: {
text: "どう行動する？",
options: [
{ text:"追いLINE", next:"res_anx" }
]
},

avd: {
text: "どうする？",
options: [
{ text:"距離を置く", next:"res_avd" }
]
},

fear: {
text: "どうなる？",
options: [
{ text:"混乱する", next:"res_fear" }
]
}
};

const results = {
res_anx: {
title:"不安型",
analysis:"相手との繋がりを失うことへの強い恐怖があり、確認行動が増える状態。",
why:"過去の経験や不安感が強く、安心材料を外に求めやすい。",
self:"不安は一時的なものと理解し、自分の感情を落ち着かせる。",
comm:"「寂しい」と素直に伝える。"
},
res_avd: {
title:"回避型",
analysis:"距離を取ることで安心しようとする傾向。",
why:"他人に踏み込まれることへの警戒。",
self:"距離を取る自分を否定しない。",
comm:"「少し一人時間がほしい」と伝える。"
},
res_fear: {
title:"恐れ型",
analysis:"近づきたいと離れたいが同時に存在。",
why:"過去の矛盾した経験。",
self:"感情を整理する時間を持つ。",
comm:"状態を正直に伝える。"
}
};

function showView(id){
document.getElementById("quiz-view").style.display="none";
document.getElementById("result-view").style.display="none";
document.getElementById("assertive-view").style.display="none";

document.getElementById(id).style.display="block";
}

function renderQuestion(id){
const q = flow[id];
const container = document.getElementById("question-container");

let html = "<h3>"+q.text+"</h3>";

q.options.forEach(o=>{
html += `<button onclick="goNext('${o.next}')">${o.text}</button>`;
});

container.innerHTML = html;
}

function goNext(next){
if(results[next]){
renderResult(next);
}else{
renderQuestion(next);
}
}

function renderResult(id){
const r = results[id];
const container = document.getElementById("result-view");

container.innerHTML = `
<h2>${r.title}</h2>

<div class="block"><b>現状</b><br>${r.analysis}</div>
<div class="block"><b>原因</b><br>${r.why}</div>
<div class="block"><b>対処</b><br>${r.self}</div>
<div class="block"><b>伝え方</b><br>${r.comm}</div>

<button class="cta-btn" onclick="showView('assertive-view')">アサーティブを見る</button>

<div style="margin-top:40px;text-align:center;font-weight:bold;">
りゅうとはずっと変わらずまさくんと一緒にいると決めてます。
</div>

<button onclick="location.reload()">最初から</button>
`;

showView("result-view");
}

renderQuestion("start");
</script>

</body>
</html>
